<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title">Cloud Library Mini Dashboard</h1>
    <p class="subtitle">Simple library dashboard running inside a Docker container.</p>

    <div class="card-container">

        <div class="card">
            <div class="card-content">
                <h3>Member</h3>
                <p>Name: Demo Member</p>
                <p>Status: Active</p>
            </div>
        </div>

        <div class="card">
            <div class="card-content">
                <h3>Books</h3>
                <p>Total Books: 24</p>

            </div>
        </div>

        <div class="card">
            <div class="card-content">
                <h3>Borrowed</h3>
                <p>Books Borrowed: 3</p>
            </div>
        </div>

        <div class="card">
            <div class="card-content">
                <h3>Available</h3>
                <p>Available Books: 21</p>
            </div>
        </div>

    </div>
</body>
</html>
